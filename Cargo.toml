[workspace]
members = [
    "programs/logos-core/core",
    "programs/logos-core",
    "programs/logos-core/guest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", package = "nssa_core" }
serde = { version = "1", default-features = false, features = ["derive"] }
borsh = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", default-features = false }
thiserror = "1"

[workspace.lints.rust]
unused = "warn"

# Disable thiserror (pulls in getrandom on RISC-V)
[profile.dev]
strip = "none"
