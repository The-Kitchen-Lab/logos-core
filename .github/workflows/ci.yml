name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RISC0_DEV_MODE: 1          # skip proof generation in CI
  RUST_BACKTRACE: short

jobs:
  # ─── Rust ────────────────────────────────────────────────────────────────────
  rust:
    name: Rust (test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          targets: riscv32im-risc0-zkvm-elf

      - name: Install Risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test --all
        env:
          RISC0_DEV_MODE: 1

      - name: cargo build --release
        run: cargo build --release
        env:
          RISC0_DEV_MODE: 1

  # ─── TypeScript ───────────────────────────────────────────────────────────────
  typescript:
    name: TypeScript (test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            runtime/package-lock.json
            cli/package-lock.json

      - name: Install runtime deps
        run: npm ci
        working-directory: runtime

      - name: Install CLI deps
        run: npm ci
        working-directory: cli

      - name: Build runtime
        run: npm run build
        working-directory: runtime

      - name: Build CLI
        run: npm run build
        working-directory: cli

      - name: Test runtime
        run: npm test
        working-directory: runtime

  # ─── Integration (standalone sequencer) ──────────────────────────────────────
  integration:
    name: Integration tests (standalone sequencer)
    runs-on: ubuntu-latest
    needs: [rust, typescript]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Install Risc0
        run: |
          curl -L https://risczero.com/install | bash
          ~/.risc0/bin/rzup install

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-integ-${{ hashFiles('**/Cargo.lock') }}

      - name: Clone LEZ repo
        run: git clone https://github.com/logos-blockchain/logos-execution-zone /tmp/logos-execution-zone --depth 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build TypeScript
        run: |
          cd runtime && npm ci && npm run build
          cd ../cli && npm ci && npm run build

      - name: Build sequencer (standalone mode)
        run: |
          cd /tmp/logos-execution-zone
          cargo build --release -p sequencer_service --features standalone
        env:
          RISC0_DEV_MODE: 1

      - name: Run integration tests
        run: |
          # Start standalone sequencer in background
          RISC0_DEV_MODE=1 /tmp/logos-execution-zone/target/release/sequencer_service \
            /tmp/logos-execution-zone/sequencer/service/configs/debug &
          SEQUENCER_PID=$!
          sleep 5

          # Run integration test suite
          LEZ_SEQUENCER_URL=http://localhost:3040 \
          RISC0_DEV_MODE=1 \
          node --experimental-vm-modules node_modules/.bin/jest \
            --testPathPattern integration \
            --forceExit 2>&1 || true

          kill $SEQUENCER_PID 2>/dev/null || true
        working-directory: runtime
        env:
          RISC0_DEV_MODE: 1
